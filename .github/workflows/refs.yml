name: nba.com referees

# Officials of every past game (one nba.com request per game), saved to data/refs.
#   fetch (Mac runner): only talks to nba.com, uploads data/refs as an artifact (also when stopped
#         early, so nothing fetched is lost). Read-only token. Resumable: saved games are skipped.
#   load  (GitHub runner): checks the files and commits them.
# Daily: the current season's new games, after the 9:05 AM game-log update.
# SECURITY: the repo is public, so the Mac job may only be started by schedule or by hand.
on:
  schedule:
    - cron: "45 14 * * *"   # 9:45 AM EST
  workflow_dispatch:
    inputs:
      first: {description: "First season (empty = current season)", default: ""}
      last:  {description: "Last season (empty = same as first)", default: ""}
      limit: {description: "Max games per season (empty = all)", default: ""}
concurrency: {group: nbarefs, cancel-in-progress: false}
jobs:
  fetch:
    runs-on: [self-hosted, nba-stats]
    timeout-minutes: 900
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v7
      - name: Python env (throwaway venv; nothing installed into the Mac's Python)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q curl_cffi pandas
      - name: Download from nba.com
        run: |
          FIRST="${{ inputs.first }}"; LAST="${{ inputs.last }}"; LIMIT="${{ inputs.limit }}"
          [ -z "$FIRST" ] && FIRST=$(python3 -c "import datetime as d; t=d.date.today(); y=t.year if t.month>=8 else t.year-1; print(f'{y}-{str(y+1)[2:]}')")
          [ -z "$LAST" ] && LAST="$FIRST"
          "$RUNNER_TEMP/venv/bin/python" src/nbarefs.py "$FIRST" "$LAST" ${LIMIT:+--limit $LIMIT}
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: refs, path: data/refs, retention-days: 7, if-no-files-found: ignore}

  load:
    needs: fetch
    if: always() && needs.fetch.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.14"}
      - run: pip install -q pandas
      - uses: actions/download-artifact@v8
        with: {name: refs, path: data/refs}
      - name: Check the data
        run: set -o pipefail; python src/nbarefs.py --check | tee check.txt
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/refs
          git diff --cached --quiet || git commit -m "nba.com referees ${{ inputs.first || 'current season' }} ${{ inputs.last }}"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 10; done
      - name: Summary
        if: always()
        run: |
          { echo '```'; cat check.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

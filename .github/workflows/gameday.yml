name: Game day

# Snapshots injuries (ESPN), lineups (Rotowire) and refs (official.nba.com) four times a day, and checks
# that the morning nba.com (Mac) and odds jobs saved yesterday. A source failing 2 runs in a row opens a
# GitHub issue labeled source-alert; it closes itself when everything works again.
# Then it rebuilds the dashboard (src/today.py -> src/paper.py (log + grade paper bets) -> src/dashboard.py
# -> docs/index.html, served by Pages).
on:
  schedule:
    - cron: "30 14 * * *"         # 9:30 AM EST: right after the Mac's nba.com update, so paper bets log near the open
    - cron: "15 16,20,23 * * *"   # 11:15 AM, 3:15 PM, 6:15 PM EST
    - cron: "15 2 * * *"          # 9:15 PM EST
  workflow_dispatch: {}
concurrency: {group: gameday, cancel-in-progress: false}
jobs:
  gameday:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: {contents: write, issues: write}
    env: {TZ: America/New_York, GH_TOKEN: "${{ github.token }}"}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.14"}
      - run: pip install -q pandas numpy
      - name: Snapshot + health
        run: python src/gameday.py | tee gameday.txt
      - name: Dashboard (today's projections)
        run: |
          set -o pipefail
          # afternoon/evening runs also project tomorrow's slate: NBA totals open the night before and move a lot,
          # so paper bets get logged near the opening line (v1's backtest edge was vs the open)
          tomorrow() { if [ "$(date +%H)" -ge 15 ]; then python src/today.py --tomorrow || echo "tomorrow's slate failed (today's still runs)"; fi; }
          { python src/today.py && tomorrow && python src/paper.py && python src/dashboard.py; } | tee -a gameday.txt
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gameday data/paper docs/index.html docs/.nojekyll
          git diff --cached --quiet || git commit -qm "Game day snapshot + dashboard $(date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep $((i * 5)); done
      - name: Source alert issue
        run: |
          gh label create source-alert --color B60205 --description "A data source failed 2+ runs in a row" 2>/dev/null || true
          bad=$(python3 -c "import json; h=json.load(open('data/gameday/health.json')); print(', '.join(f'{k} ({v} runs)' for k, v in sorted(h.items()) if v >= 2))")
          open=$(gh issue list --label source-alert --state open --json number -q '.[0].number')
          if [ -n "$bad" ] && [ -z "$open" ]; then
            gh issue create --label source-alert --title "Source failing: $bad" --body "$(printf 'Run: %s/%s/actions/runs/%s\n\n```\n%s\n```' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(cat gameday.txt)")"
          elif [ -n "$bad" ]; then
            gh issue comment "$open" --body "Still failing: $bad ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "All sources working again ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          fi
      - name: Summary
        if: always()
        run: |
          { echo '```'; cat gameday.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
